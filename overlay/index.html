<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: transparent;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      display: inline-block;
    }

    .widget {
      position: relative;
      display: inline-flex;
      flex-direction: column;
      gap: 0;
      padding: 12px 20px 14px;
      background: rgba(13, 17, 23, 0.82);
      border: 1px solid rgba(255, 224, 51, 0.18);
      border-radius: 10px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      min-width: 210px;
    }

    /* Accent-Linie oben */
    .widget::before {
      content: '';
      position: absolute;
      top: 0; left: 16px; right: 16px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #ffe033, transparent);
      border-radius: 0 0 2px 2px;
    }

    .label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: rgba(255, 224, 51, 0.7);
      margin-bottom: 3px;
    }

    .value {
      font-size: 38px;
      font-weight: 900;
      color: #ffffff;
      line-height: 1;
      letter-spacing: -1px;
      text-shadow: 0 2px 16px rgba(0,0,0,.8);
      transition: color 0.3s ease;
    }

    .value.flash { color: #ffe033; }

    /* Fortschrittsbalken */
    .prog-track {
      margin-top: 8px;
      height: 3px;
      background: rgba(255,255,255,.08);
      border-radius: 3px;
      overflow: hidden;
    }
    .prog-fill {
      height: 100%;
      background: linear-gradient(90deg, #ffe033, #ffb700);
      border-radius: 3px;
      transition: width 0.6s ease;
    }

    /* Ziel-erreicht */
    .done-banner {
      display: none;
      margin-top: 6px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #3fb950;
      text-transform: uppercase;
    }

    .paused-banner {
      display: none;
      margin-top: 6px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: rgba(248,81,73,.9);
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="widget" id="widget">
    <div class="label">Restdamage</div>
    <div class="value" id="val">–––.–––</div>
    <div class="prog-track">
      <div class="prog-fill" id="prog" style="width:0%"></div>
    </div>
    <div class="done-banner"   id="done">✓ Ziel erreicht!</div>
    <div class="paused-banner" id="paused">⏸ Pause</div>
  </div>

  <script>
    const POLL_MS = 500;
    let lastVal = null;
    let flashTimer = null;

    const valEl    = document.getElementById('val');
    const progEl   = document.getElementById('prog');
    const doneEl   = document.getElementById('done');
    const pausedEl = document.getElementById('paused');

    function fmt(n) {
      return Math.max(0, Math.round(n)).toLocaleString('de-DE');
    }

    async function poll() {
      try {
        const d = await (await fetch('/status')).json();
        const rem   = d.remaining;
        const goal  = d.goal;
        const done  = rem <= 0;
        const pct   = goal > 0 ? Math.min(100, (goal - rem) / goal * 100) : 0;

        if (lastVal !== null && rem !== lastVal) {
          clearTimeout(flashTimer);
          valEl.classList.add('flash');
          flashTimer = setTimeout(() => valEl.classList.remove('flash'), 600);
        }

        valEl.textContent          = fmt(rem);
        progEl.style.width         = pct + '%';
        doneEl.style.display       = done           ? 'block' : 'none';
        pausedEl.style.display     = d.paused && !done ? 'block' : 'none';
        lastVal = rem;
      } catch (_) {}
    }

    poll();
    setInterval(poll, POLL_MS);
  </script>
</body>
</html>

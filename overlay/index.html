<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Mohjos DamageRace — Overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent;
      font-family: 'Inter', system-ui, sans-serif;
      overflow: hidden;
      color: #fff;
      display: inline-block;
    }

    .widget {
      position: relative;
      display: inline-flex;
      flex-direction: column;
      gap: 10px;
      padding: 14px 18px 16px;
      background: rgba(13, 13, 20, 0.86);
      border: 1px solid rgba(255, 215, 0, 0.22);
      border-radius: 14px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      min-width: 260px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    .widget::before {
      content: '';
      position: absolute;
      top: 0; left: 18px; right: 18px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #ffd700, transparent);
      border-radius: 0 0 2px 2px;
    }

    .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .head-left { display: flex; align-items: center; gap: 8px; }
    .mark {
      width: 22px; height: 22px;
      border-radius: 5px;
      background: linear-gradient(135deg, #ffd700, #efb700);
      display: flex; align-items: center; justify-content: center;
      color: #000; font-weight: 900; font-size: 12px;
    }
    .ev-name {
      font-size: 10px; font-weight: 700;
      letter-spacing: 1.8px; text-transform: uppercase;
      color: rgba(255, 215, 0, 0.85);
    }
    .ev-name .sub {
      color: rgba(255, 255, 255, 0.45);
      font-weight: 500; letter-spacing: 0.5px;
      margin-left: 6px;
    }

    .global .label {
      font-size: 9px; font-weight: 700;
      letter-spacing: 2.5px; text-transform: uppercase;
      color: rgba(255, 255, 255, 0.55);
      margin-bottom: 2px;
    }
    .value {
      font-size: 40px; font-weight: 900;
      line-height: 1; letter-spacing: -1.2px;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.8);
      transition: color 0.3s ease;
    }
    .value.flash { color: #ffd700; }

    .prog {
      margin-top: 8px;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      overflow: hidden;
    }
    .prog-fill {
      height: 100%;
      background: linear-gradient(90deg, #ffd700, #efb700);
      border-radius: 4px;
      transition: width 0.6s ease;
    }

    .teams { display: flex; flex-direction: column; gap: 7px; margin-top: 4px; }
    .team-row {
      display: grid;
      grid-template-columns: 12px 1fr auto;
      gap: 8px; align-items: center;
    }
    .team-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      box-shadow: 0 0 8px currentColor;
    }
    .team-bar {
      position: relative;
      height: 14px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 4px;
      overflow: hidden;
    }
    .team-bar-fill {
      position: absolute; left: 0; top: 0; bottom: 0;
      transition: width 0.6s ease;
      border-radius: 4px;
    }
    .team-name {
      position: absolute; left: 8px; top: 50%;
      transform: translateY(-50%);
      font-size: 10px; font-weight: 700;
      letter-spacing: 0.8px;
      color: rgba(255, 255, 255, 0.95);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.7);
      mix-blend-mode: difference;
      pointer-events: none;
    }
    .team-dmg {
      font-size: 12px; font-weight: 700;
      color: #fff;
      font-variant-numeric: tabular-nums;
      min-width: 56px; text-align: right;
    }

    .banner {
      display: none;
      margin-top: 4px;
      padding: 4px 0;
      font-size: 10px; font-weight: 700;
      letter-spacing: 1.5px; text-transform: uppercase;
      text-align: center;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    .banner.done    { color: #00e676; }
    .banner.paused  { color: #ff9800; }
    .banner.expired { color: #ff5252; }

    .countdown {
      font-size: 11px; font-weight: 700;
      letter-spacing: 1.2px;
      color: rgba(255, 255, 255, 0.7);
      font-variant-numeric: tabular-nums;
      padding-left: 8px;
    }
    .countdown.warn { color: #ffd700; }
    .countdown.crit { color: #ff5252; }
  </style>
</head>
<body>
  <div class="widget">
    <div class="head">
      <div class="head-left">
        <div class="mark">M</div>
        <div class="ev-name" id="evname">DamageRace<span class="sub" id="evsub"></span></div>
      </div>
      <div class="countdown" id="countdown"></div>
    </div>

    <div class="global">
      <div class="label" id="lbl-remaining" data-i18n="overlay.remaining">Restschaden</div>
      <div class="value" id="val">–––.–––</div>
      <div class="prog"><div class="prog-fill" id="prog" style="width:0%"></div></div>
    </div>

    <div class="teams" id="teams"></div>

    <div class="banner done"    id="done"    data-i18n="overlay.goal_reached">✓ Ziel erreicht!</div>
    <div class="banner paused"  id="paused"  data-i18n="overlay.paused">⏸ Pause</div>
    <div class="banner expired" id="expired" data-i18n="overlay.expired">⏱ Zeit abgelaufen</div>
  </div>

  <script src="/i18n.js"></script>
  <script>
    const POLL_MS = 500;
    let lastValue = null;
    let flashTimer = null;
    let lastLblKey = null;

    const $ = function (id) { return document.getElementById(id); };

    function localeForFormat() {
      return i18n.get() === 'en' ? 'en-US' : 'de-DE';
    }
    function fmt(n) {
      return Math.max(0, Math.round(n)).toLocaleString(localeForFormat());
    }

    const slug = window.location.pathname.split('/').filter(Boolean).pop() || '';
    const STATUS_URL = '/status/' + encodeURIComponent(slug);

    async function poll() {
      try {
        const res = await fetch(STATUS_URL);
        const data = await res.json();
        if (data.error) return;

        const event = data.event || {};
        const goal = event.goal;
        const isVersus = event.mode === 'versus';
        const teams = data.teams || [];

        // In versus, every team races to `goal` independently. The "Restschaden"
        // shown at the top is the leading team's remaining damage (i.e. how
        // much the closest-to-victory team still needs). In coop it's the
        // shared global remaining as before.
        let remaining, percent, done;
        if (isVersus && teams.length) {
          const teamRemaining = teams.map(function (t) {
            return Math.max(0, goal - t.damage);
          });
          remaining = Math.min.apply(null, teamRemaining);
          percent = goal > 0 ? Math.min(100, (goal - remaining) / goal * 100) : 0;
          done = remaining <= 0;
        } else {
          remaining = event.remaining;
          done = remaining <= 0;
          percent = goal > 0 ? Math.min(100, (goal - remaining) / goal * 100) : 0;
        }

        $('evname').firstChild.nodeValue = event.name || 'DamageRace';
        $('evsub').textContent = isVersus
          ? ' · Versus'
          : (event.mode === 'coop' ? ' · Coop' : '');

        // Re-label the global counter to match what's shown. Only touch the
        // DOM when the mode actually flips — poll() runs twice a second.
        const lblKey = isVersus ? 'overlay.remaining_to_win' : 'overlay.remaining';
        const lbl = $('lbl-remaining');
        if (lbl && lblKey !== lastLblKey) {
          lastLblKey = lblKey;
          lbl.setAttribute('data-i18n', lblKey);
          if (window.i18n && typeof i18n.t === 'function') {
            lbl.textContent = i18n.t(lblKey);
          }
        }

        if (lastValue !== null && remaining !== lastValue) {
          clearTimeout(flashTimer);
          $('val').classList.add('flash');
          flashTimer = setTimeout(function () { $('val').classList.remove('flash'); }, 600);
        }
        $('val').textContent = fmt(remaining);
        $('prog').style.width = percent + '%';

        const teamsEl = $('teams');
        teamsEl.innerHTML = '';
        (data.teams || []).forEach(function (team) {
          const teamGoal = event.mode === 'versus' ? goal : Math.max(goal, team.damage);
          const teamPct  = teamGoal > 0 ? Math.min(100, team.damage / teamGoal * 100) : 0;
          const row = document.createElement('div');
          row.className = 'team-row';
          row.innerHTML =
            '<div class="team-dot" style="background:' + team.color + ';color:' + team.color + '"></div>' +
            '<div class="team-bar">' +
              '<div class="team-bar-fill" style="width:' + teamPct + '%;' +
                'background:linear-gradient(90deg, ' + team.color + 'cc, ' + team.color + ')"></div>' +
              '<div class="team-name">' + team.name + '</div>' +
            '</div>' +
            '<div class="team-dmg">' + fmt(team.damage) + '</div>';
          teamsEl.appendChild(row);
        });

        // Deadline countdown + expired banner.
        const cdEl = $('countdown');
        const expired = !!event.expired;
        if (event.deadline_at) {
          const ms = new Date(event.deadline_at).getTime() - Date.now();
          if (ms > 0) {
            const s = Math.floor(ms / 1000);
            const hh = String(Math.floor(s / 3600)).padStart(2, '0');
            const mm = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
            const ss = String(s % 60).padStart(2, '0');
            cdEl.textContent = '⏱ ' + (hh === '00' ? mm + ':' + ss : hh + ':' + mm + ':' + ss);
            cdEl.className = 'countdown' +
              (ms < 60_000 ? ' crit' : ms < 300_000 ? ' warn' : '');
          } else {
            cdEl.textContent = '';
          }
        } else {
          cdEl.textContent = '';
        }

        $('done').style.display    = done && !expired ? 'block' : 'none';
        $('paused').style.display  = event.paused && !done && !expired ? 'block' : 'none';
        $('expired').style.display = expired ? 'block' : 'none';
        lastValue = remaining;
      } catch (_) { /* network errors are non-fatal */ }
    }

    poll();
    setInterval(poll, POLL_MS);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mohjos DamageRace — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/brand.css">
  <style>
    body.page {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .login-card {
      position: relative;
      width: 100%; max-width: 400px;
      background: var(--md3-surface-container);
      border: 1px solid var(--md3-outline);
      border-radius: var(--r-lg);
      overflow: hidden;
      box-shadow: var(--md3-shadow-4), var(--md3-shadow-glow);
      z-index: 1;
    }
    .login-top {
      padding: 36px 32px 24px;
      text-align: center;
      background:
        radial-gradient(ellipse at top, rgba(255, 215, 0, 0.08) 0%, transparent 70%),
        var(--md3-surface-container-high);
      border-bottom: 1px solid var(--md3-outline);
    }
    .logo-mark {
      width: 56px; height: 56px;
      margin: 0 auto 14px;
      border-radius: var(--r-md);
      background: linear-gradient(135deg, #ffd700 0%, #efb700 100%);
      display: flex; align-items: center; justify-content: center;
      color: #000; font-weight: 900; font-size: 28px;
      box-shadow: var(--md3-shadow-3), var(--md3-shadow-glow);
    }
    .login-title {
      font-size: 22px; font-weight: 800;
      color: var(--md3-primary);
      letter-spacing: -0.4px;
    }
    .login-sub {
      font-size: 13px; color: var(--text-muted);
      margin-top: 4px;
    }
    .login-body { padding: 28px 32px 32px; }
    .err-box {
      display: none;
      margin-top: 14px;
      padding: 10px 14px;
      background: var(--md3-error-container);
      border: 1px solid rgba(207, 102, 121, 0.3);
      border-radius: var(--r-sm);
      color: var(--md3-error-strong);
      font-size: 13px;
    }
    .login-footer {
      text-align: center;
      padding: 14px 32px;
      border-top: 1px solid var(--md3-outline-variant);
      font-size: 11px; color: var(--text-dim);
      letter-spacing: 0.5px;
    }
    button#btn { margin-top: 20px; }
  </style>
</head>
<body class="page">
  <div class="login-card">
    <div class="login-top">
      <div class="logo-mark">M</div>
      <div class="login-title">Mohjos DamageRace</div>
      <div class="login-sub">Veranstalter — Login</div>
    </div>
    <div class="login-body">
      <label for="pw">Passwort</label>
      <input type="password" id="pw" placeholder="••••••••••••"
             autofocus autocomplete="current-password">
      <div class="err-box" id="err"></div>
      <button id="btn" class="btn btn-primary btn-block" onclick="doLogin()">Anmelden</button>
    </div>
    <div class="login-footer">Mohjo_beist · Community Damage Race</div>
  </div>

  <script>
    document.getElementById('pw').addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });

    async function doLogin() {
      const pw  = document.getElementById('pw').value;
      const btn = document.getElementById('btn');
      const err = document.getElementById('err');
      if (!pw) return;

      btn.disabled = true;
      btn.textContent = 'Anmelden…';
      err.style.display = 'none';
      try {
        const res = await fetch('/login', {
          method: 'POST', credentials: 'include',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({password: pw}),
        });
        const data = await res.json();
        if (data.ok) {
          window.location.href = '/admin';
        } else {
          err.textContent = data.error || 'Falsches Passwort';
          err.style.display = 'block';
          document.getElementById('pw').value = '';
          document.getElementById('pw').focus();
        }
      } catch (e) {
        err.textContent = 'Verbindung zum Server fehlgeschlagen.';
        err.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Anmelden';
      }
    }
  </script>
</body>
</html>

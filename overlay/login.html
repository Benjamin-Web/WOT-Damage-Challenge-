<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BeastSync — Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #0d1117;
      --bg2:    #161b22;
      --bdr:    #30363d;
      --accent: #ffe033;
      --white:  #e6edf3;
      --gray:   #8b949e;
      --red:    #f85149;
    }

    body {
      background: var(--bg);
      color: var(--white);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      width: 100%;
      max-width: 380px;
      padding: 0;
      background: var(--bg2);
      border: 1px solid var(--bdr);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 24px 64px rgba(0,0,0,.6);
    }

    .card-top {
      background: linear-gradient(135deg, #1a1f2e 0%, #0d1117 100%);
      padding: 36px 32px 28px;
      text-align: center;
      border-bottom: 1px solid var(--bdr);
    }

    .logo { font-size: 40px; margin-bottom: 12px; }

    .brand {
      font-size: 22px;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: -.5px;
    }

    .sub {
      font-size: 13px;
      color: var(--gray);
      margin-top: 4px;
    }

    .card-body { padding: 28px 32px 32px; }

    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--gray);
      margin-bottom: 8px;
    }

    input[type="password"] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--bdr);
      border-radius: 8px;
      color: var(--white);
      font-family: inherit;
      font-size: 15px;
      padding: 11px 14px;
      outline: none;
      transition: border-color .15s;
    }

    input[type="password"]:focus { border-color: var(--accent); }

    .error {
      display: none;
      background: rgba(248,81,73,.12);
      border: 1px solid rgba(248,81,73,.3);
      border-radius: 6px;
      color: var(--red);
      font-size: 13px;
      padding: 10px 14px;
      margin-top: 14px;
    }

    button {
      margin-top: 20px;
      width: 100%;
      background: var(--accent);
      color: #0d1117;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      padding: 13px;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
    }

    button:hover  { opacity: .9; }
    button:active { transform: scale(.98); }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
      transform: none;
    }

    .footer {
      text-align: center;
      font-size: 11px;
      color: var(--gray);
      padding: 16px 32px;
      border-top: 1px solid var(--bdr);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-top">
      <div class="logo">🐾</div>
      <div class="brand">BeastSync</div>
      <div class="sub">Mohjo_beist — Admin</div>
    </div>

    <div class="card-body">
      <label for="pw">Passwort</label>
      <input type="password" id="pw" placeholder="••••••••••••"
             autofocus autocomplete="current-password">
      <div class="error" id="err"></div>
      <button id="btn" onclick="doLogin()">Anmelden</button>
    </div>

    <div class="footer">BeastSync Community Damage Tracker</div>
  </div>

  <script>
    document.getElementById('pw').addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });

    async function doLogin() {
      const pw  = document.getElementById('pw').value;
      const btn = document.getElementById('btn');
      const err = document.getElementById('err');

      if (!pw) return;

      btn.disabled    = true;
      btn.textContent = 'Anmelden…';
      err.style.display = 'none';

      try {
        const res = await fetch('/login', {
          method:      'POST',
          credentials: 'include',
          headers:     {'Content-Type': 'application/json'},
          body:        JSON.stringify({password: pw}),
        });
        const data = await res.json();

        if (data.ok) {
          window.location.href = '/admin';
        } else {
          err.textContent   = data.error || 'Falsches Passwort';
          err.style.display = 'block';
          document.getElementById('pw').value = '';
          document.getElementById('pw').focus();
        }
      } catch (e) {
        err.textContent   = 'Verbindung zum Server fehlgeschlagen.';
        err.style.display = 'block';
      } finally {
        btn.disabled    = false;
        btn.textContent = 'Anmelden';
      }
    }
  </script>
</body>
</html>

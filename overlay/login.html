<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mohjos DamageRace — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/brand.css">
  <style>
    body.page {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
      position: relative;
    }
    .lang-bar {
      position: fixed; top: 20px; right: 24px; z-index: 5;
    }
    .login-card {
      position: relative;
      width: 100%; max-width: 440px;
      background: var(--md3-surface-container);
      border: 1px solid var(--md3-outline);
      border-radius: var(--r-lg);
      overflow: hidden;
      box-shadow: var(--md3-shadow-4), var(--md3-shadow-glow);
      z-index: 1;
    }
    .login-top {
      padding: 40px 32px 28px;
      text-align: center;
      background:
        radial-gradient(ellipse at top, rgba(255, 215, 0, 0.10) 0%, transparent 70%),
        var(--md3-surface-container-high);
      border-bottom: 1px solid var(--md3-outline);
    }
    .logo-mark {
      width: 64px; height: 64px;
      margin: 0 auto 16px;
      border-radius: var(--r-md);
      background: linear-gradient(135deg, #ffd700 0%, #efb700 100%);
      display: flex; align-items: center; justify-content: center;
      color: #000; font-weight: 900; font-size: 32px;
      box-shadow: var(--md3-shadow-3), var(--md3-shadow-glow);
    }
    .login-title { font-size: 24px; font-weight: 800; color: var(--md3-primary); letter-spacing: -0.4px; }
    .login-sub   { font-size: 13px; color: var(--text-muted); margin-top: 6px; }
    .login-body  { padding: 32px; text-align: center; }
    .twitch-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; padding: 14px 18px;
      background: #9146ff; color: #fff; border: 0;
      border-radius: var(--r-sm);
      font-family: var(--font-ui);
      font-size: 15px; font-weight: 700;
      cursor: pointer;
      transition: all 0.2s var(--ease-standard);
      text-decoration: none;
    }
    .twitch-btn:hover {
      background: #7d2def;
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(145, 70, 255, 0.4);
    }
    .twitch-btn svg { width: 22px; height: 22px; fill: #fff; }
    .info-block {
      margin-top: 22px; padding: 14px;
      background: var(--md3-surface-dim);
      border: 1px solid var(--md3-outline-variant);
      border-radius: var(--r-sm);
      font-size: 12px; color: var(--text-muted);
      line-height: 1.6; text-align: left;
    }
    .info-block strong { color: var(--md3-primary); }
    .login-footer {
      text-align: center;
      padding: 14px 32px;
      border-top: 1px solid var(--md3-outline-variant);
      font-size: 11px; color: var(--text-dim);
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body class="page">
  <div class="lang-bar" id="lang-bar"></div>

  <div class="login-card">
    <div class="login-top">
      <div class="logo-mark">M</div>
      <div class="login-title">Mohjos DamageRace</div>
      <div class="login-sub" data-i18n="login.subtitle">Veranstalter-Login</div>
    </div>
    <div class="login-body">
      <a href="/auth/twitch/start" class="twitch-btn">
        <svg viewBox="0 0 24 24"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714Z"/></svg>
        <span data-i18n="login.with_twitch">Mit Twitch anmelden</span>
      </a>

      <div class="info-block">
        <strong data-i18n="login.info_title">Keine Anmeldung als Streamer noetig.</strong><br>
        <span data-i18n="login.info_body">Wenn du nur an einem Event teilnehmen willst, lade die DamageRace-App, gib den Invite-Code deines Veranstalters ein und installier den WoT-Mod.</span>
      </div>
    </div>
    <div class="login-footer" data-i18n="login.footer">Mohjos DamageRace · Twitch-Login</div>
  </div>

  <script src="/i18n.js"></script>
  <script>i18n.mountToggle(document.getElementById('lang-bar'));</script>
</body>
</html>

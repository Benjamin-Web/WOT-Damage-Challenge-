<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BeastSync Admin</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0d1117;
      --bg2:     #161b22;
      --bg3:     #1c2128;
      --bdr:     #30363d;
      --accent:  #ffe033;
      --green:   #3fb950;
      --red:     #f85149;
      --orange:  #d29922;
      --white:   #e6edf3;
      --gray:    #8b949e;
      --radius:  8px;
    }

    body {
      background: var(--bg);
      color: var(--white);
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 14px;
      min-height: 100vh;
    }

    /* ── Topbar ── */
    .topbar {
      background: var(--bg2);
      border-bottom: 1px solid var(--bdr);
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .topbar-logo { font-size: 22px; }
    .topbar-brand { font-size: 17px; font-weight: 800; color: var(--accent); }
    .topbar-sub { font-size: 12px; color: var(--gray); }
    .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
    .dot-live {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .live-label { font-size: 12px; color: var(--green); font-weight: 600; }

    .btn-logout {
      background: transparent;
      border: 1px solid var(--bdr);
      color: var(--gray);
      border-radius: 6px;
      padding: 5px 14px;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      transition: border-color .15s, color .15s;
    }
    .btn-logout:hover { border-color: var(--red); color: var(--red); }

    /* ── Paused banner ── */
    .paused-banner {
      display: none;
      background: linear-gradient(90deg, #c0392b, #e74c3c);
      color: #fff;
      text-align: center;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 2px;
      padding: 10px;
    }

    /* ── Layout ── */
    .layout {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 20px;
      padding: 24px;
      max-width: 1200px;
      margin: 0 auto;
    }
    @media (max-width: 800px) { .layout { grid-template-columns: 1fr; } }

    /* ── Cards ── */
    .card {
      background: var(--bg2);
      border: 1px solid var(--bdr);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 16px;
    }
    .card:last-child { margin-bottom: 0; }
    .card-head {
      padding: 12px 18px;
      border-bottom: 1px solid var(--bdr);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--gray);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-body { padding: 18px; }

    /* ── Stats ── */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }
    .stat {
      background: var(--bg2);
      border: 1px solid var(--bdr);
      border-radius: var(--radius);
      padding: 18px 16px;
      text-align: center;
    }
    .stat .s-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--gray);
    }
    .stat .s-val {
      font-size: 30px;
      font-weight: 900;
      margin-top: 6px;
      line-height: 1;
    }
    .stat.s-rem  .s-val { color: var(--accent); }
    .stat.s-done .s-val { color: var(--green); }

    /* ── Progress ── */
    .prog-wrap {
      background: var(--bg3);
      border-radius: 6px;
      height: 10px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .prog-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #ffb700);
      border-radius: 6px;
      transition: width .5s ease;
    }

    /* ── Table ── */
    table { width: 100%; border-collapse: collapse; }
    th {
      padding: 8px 14px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--gray);
      border-bottom: 1px solid var(--bdr);
      text-align: left;
    }
    td {
      padding: 11px 14px;
      border-bottom: 1px solid var(--bg3);
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--bg3); }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
    }
    .badge-online  { background: rgba(63,185,80,.15); color: var(--green); }
    .badge-offline { background: rgba(139,148,158,.1); color: var(--gray); }
    .badge-inactive{ background: rgba(139,148,158,.05); color: var(--gray);
                     font-style: italic; }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 18px;
      border: none;
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
      text-decoration: none;
    }
    .btn:active { transform: scale(.97); }
    .btn:hover  { opacity: .85; }
    .btn-primary { background: var(--accent); color: #0d1117; }
    .btn-danger  { background: rgba(248,81,73,.15); color: var(--red);
                   border: 1px solid rgba(248,81,73,.3); }
    .btn-ghost   { background: var(--bg3); color: var(--white);
                   border: 1px solid var(--bdr); }
    .btn-pause   { background: rgba(210,153,34,.15); color: var(--orange);
                   border: 1px solid rgba(210,153,34,.3); }
    .btn-resume  { background: rgba(63,185,80,.15); color: var(--green);
                   border: 1px solid rgba(63,185,80,.3); }
    .btn-sm { padding: 4px 10px; font-size: 11px; border-radius: 6px; }
    .btn-full { width: 100%; justify-content: center; }

    /* ── Inputs ── */
    .field { margin-bottom: 12px; }
    .field label {
      display: block;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--gray);
      margin-bottom: 6px;
    }
    input[type="text"], input[type="number"] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--bdr);
      border-radius: var(--radius);
      color: var(--white);
      font-family: inherit;
      font-size: 13px;
      padding: 9px 12px;
      outline: none;
      transition: border-color .15s;
    }
    input:focus { border-color: var(--accent); }

    /* ── Log ── */
    .log {
      font-family: 'Consolas', 'SF Mono', monospace;
      font-size: 12px;
      max-height: 240px;
      overflow-y: auto;
    }
    .log::-webkit-scrollbar { width: 4px; }
    .log::-webkit-scrollbar-thumb { background: var(--bdr); border-radius: 2px; }
    .log-row {
      display: grid;
      grid-template-columns: 54px 1fr auto auto;
      gap: 8px;
      padding: 6px 0;
      border-bottom: 1px solid var(--bg3);
      align-items: center;
    }
    .log-row:last-child { border-bottom: none; }
    .lt  { color: var(--gray); }
    .lwho{ font-weight: 700; }
    .ldmg{ color: var(--green); }
    .lrem{ color: var(--accent); text-align: right; }

    .hint { font-size: 11px; color: var(--gray); margin-top: 10px; line-height: 1.5; }

    /* ── Divider ── */
    .divider { height: 1px; background: var(--bdr); margin: 12px 0; }
  </style>
</head>
<body>

<div class="paused-banner" id="paused-banner">⏸  EVENT PAUSIERT</div>

<div class="topbar">
  <span class="topbar-logo">🐾</span>
  <div>
    <div class="topbar-brand">BeastSync</div>
    <div class="topbar-sub" id="top-sub">Admin-Panel</div>
  </div>
  <div class="topbar-right">
    <div class="dot-live"></div>
    <span class="live-label">LIVE</span>
    <button class="btn-logout" onclick="logout()">Abmelden</button>
  </div>
</div>

<div class="layout">

  <!-- Linke Spalte -->
  <div>

    <!-- Stats -->
    <div class="stats">
      <div class="stat s-rem">
        <div class="s-label">Restdamage</div>
        <div class="s-val" id="s-rem">–</div>
      </div>
      <div class="stat s-done">
        <div class="s-label">Dealt gesamt</div>
        <div class="s-val" id="s-dealt">–</div>
      </div>
      <div class="stat">
        <div class="s-label">Ziel</div>
        <div class="s-val" id="s-goal">–</div>
      </div>
    </div>
    <div class="prog-wrap"><div class="prog-bar" id="pbar" style="width:0%"></div></div>

    <!-- Streamer -->
    <div class="card">
      <div class="card-head">👥 Streamer</div>
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Damage</th>
            <th>Zuletzt</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="streamer-tbody"></tbody>
      </table>
    </div>

    <!-- Log -->
    <div class="card">
      <div class="card-head">📋 Live-Log</div>
      <div class="card-body">
        <div class="log" id="log"></div>
      </div>
    </div>

  </div>

  <!-- Rechte Spalte -->
  <div>

    <!-- Streamer hinzufügen -->
    <div class="card">
      <div class="card-head">➕ Streamer hinzufügen</div>
      <div class="card-body">
        <div class="field">
          <label>WoT-Account-Name</label>
          <input type="text" id="add-name" placeholder="z.B. Mohjo_beist"
                 onkeydown="if(event.key==='Enter') addStreamer()">
        </div>
        <button class="btn btn-primary btn-full" onclick="addStreamer()">
          + Hinzufügen
        </button>
        <p class="hint">
          Unbekannte Streamer werden beim ersten Damage automatisch registriert.
        </p>
      </div>
    </div>

    <!-- Event steuern -->
    <div class="card">
      <div class="card-head">⚙️ Event steuern</div>
      <div class="card-body" style="display:flex;flex-direction:column;gap:10px">
        <div class="field" style="margin-bottom:0">
          <label>Schaden-Ziel</label>
          <input type="number" id="goal-input" placeholder="z.B. 100000" min="1">
        </div>
        <button class="btn btn-ghost btn-full" onclick="setGoal()">
          Ziel setzen
        </button>
        <div class="divider"></div>
        <button class="btn btn-pause btn-full" id="btn-pause" onclick="togglePause()">
          ⏸  Pause
        </button>
        <button class="btn btn-danger btn-full" onclick="doReset()">
          ↺  Reset — Daten löschen
        </button>
      </div>
    </div>

  </div>
</div>

<script>
  let paused = false;
  const fmt  = n => Math.max(0, Math.round(n)).toLocaleString('de-DE');

  function timeSince(iso) {
    if (!iso) return '—';
    const s = Math.round((Date.now() - new Date(iso).getTime()) / 1000);
    if (s < 5)  return 'gerade';
    if (s < 60) return s + 's';
    return Math.round(s / 60) + 'min';
  }

  async function poll() {
    try {
      const d = await (await fetch('/status')).json();
      render(d);
    } catch (_) {}
  }

  function render(d) {
    paused = d.paused;

    document.getElementById('s-rem').textContent   = fmt(d.remaining);
    document.getElementById('s-dealt').textContent = fmt(d.total_dealt);
    document.getElementById('s-goal').textContent  = fmt(d.goal);
    document.getElementById('top-sub').textContent =
      fmt(d.total_dealt) + ' / ' + fmt(d.goal) + ' Damage';
    document.getElementById('paused-banner').style.display = paused ? 'block' : 'none';

    const pct = d.goal > 0 ? Math.min(100, d.total_dealt / d.goal * 100) : 0;
    document.getElementById('pbar').style.width = pct + '%';

    const bp = document.getElementById('btn-pause');
    bp.className = 'btn btn-full ' + (paused ? 'btn-resume' : 'btn-pause');
    bp.textContent = paused ? '▶  Fortsetzen' : '⏸  Pause';

    // Streamer-Tabelle
    const tbody = document.getElementById('streamer-tbody');
    tbody.innerHTML = '';
    const entries = Object.entries(d.streamers);
    entries.sort((a,b) => b[1].damage - a[1].damage);

    for (const [name, info] of entries) {
      const active = info.active !== false;
      const age    = info.last_seen
        ? (Date.now() - new Date(info.last_seen).getTime()) / 1000 : Infinity;
      const online = active && age < 90;

      let badgeCls = online ? 'badge-online' : (active ? 'badge-offline' : 'badge-inactive');
      let badgeTxt = online ? '● Online'      : (active ? '○ Offline'    : '— Inaktiv');

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td style="font-weight:700">${name}</td>
        <td>${fmt(info.damage)}</td>
        <td style="color:var(--gray)">${timeSince(info.last_seen)}</td>
        <td><span class="badge ${badgeCls}">${badgeTxt}</span></td>
        <td>
          ${active
            ? `<button class="btn btn-sm btn-danger" onclick="removeStreamer('${name}')">✕</button>`
            : `<button class="btn btn-sm btn-ghost"  onclick="readdStreamer('${name}')">+</button>`}
        </td>`;
      tbody.appendChild(tr);
    }

    if (!entries.length) {
      tbody.innerHTML =
        '<tr><td colspan="5" style="color:var(--gray);text-align:center;padding:20px">'+
        'Noch keine Streamer.</td></tr>';
    }

    // Log
    const logEl   = document.getElementById('log');
    const entries2 = (d.event_log || []).slice().reverse();
    logEl.innerHTML = entries2.length
      ? entries2.map(e => `
          <div class="log-row">
            <span class="lt">${e.t}</span>
            <span class="lwho">${e.streamer}</span>
            <span class="ldmg">+${fmt(e.damage)}</span>
            <span class="lrem">${fmt(e.remaining)}</span>
          </div>`).join('')
      : '<div style="color:var(--gray);padding:8px 0">Noch keine Einträge.</div>';
  }

  async function post(path, body) {
    const r = await fetch(path, {
      method: 'POST',
      credentials: 'include',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body),
    });
    if (r.status === 401 || r.status === 403) {
      window.location.href = '/login';
      return null;
    }
    return r.json();
  }

  async function addStreamer() {
    const name = document.getElementById('add-name').value.trim();
    if (!name) return;
    const r = await post('/admin/streamers', {action: 'add', name});
    if (r?.ok) { document.getElementById('add-name').value = ''; poll(); }
    else if (r) alert(r.error);
  }

  async function removeStreamer(name) {
    if (!confirm(`"${name}" deaktivieren?`)) return;
    const r = await post('/admin/streamers', {action: 'remove', name});
    if (r?.ok) poll();
  }

  async function readdStreamer(name) {
    const r = await post('/admin/streamers', {action: 'add', name});
    if (r?.ok) poll();
  }

  async function setGoal() {
    const goal = parseInt(document.getElementById('goal-input').value);
    if (!goal || goal <= 0) { alert('Bitte ein gültiges Ziel eingeben.'); return; }
    await post('/admin/set', {goal});
    poll();
  }

  async function doReset() {
    if (!confirm('Wirklich alle Damage-Daten zurücksetzen?')) return;
    const goal = parseInt(document.getElementById('goal-input').value) || null;
    await post('/admin/set', {reset: true, goal});
    poll();
  }

  async function togglePause() {
    await post('/admin/pause', {paused: !paused});
    poll();
  }

  async function logout() {
    await fetch('/logout', {credentials: 'include'});
    window.location.href = '/login';
  }

  poll();
  setInterval(poll, 2000);
</script>
</body>
</html>
